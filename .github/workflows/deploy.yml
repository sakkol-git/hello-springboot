name: deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v4
      
    - name: set up java
      uses: actions/setup-java@v6.0.1
      with:
        distribution: 'temurin'
        java-version: '17'
      
    - name: build jar file
      run: ./mvnw clean package -DiskipTests

    - name: login to docker
      uses: docker/login-action@v4.6.0
      with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hello-springboot:latest
          file: Dockerfile
          context: .

    - name: SSH and deploy to EC2
      uses: appleboy/ssh-action@v1
      with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
             docker stop hello-springboot
             docker rm hello-springboot
             docker pull wizzard2026/hello-springboot
             docker run -d --name=hello-springboot -p 80:8080 wizzard2026/hello-springboot
    


